name: One-time merged branch cleanup

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cleanup-merged-branches.yml"

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete branches whose PRs are merged
        uses: actions/github-script@v7
        with:
          script: |
            const candidates = [
              { branch: "recovery/normalize-cloudflare-worker-source", pr: 1 },
              { branch: "recovery/separate-schema-snapshot-from-migrations", pr: 2 },
              { branch: "fix/hourly-pull-cron", pr: 4 },
              { branch: "fix/preserve-hourly-maintenance", pr: 5 },
              { branch: "fix/telegram-note-path-column", pr: 6 },
              { branch: "fix/prevent-sync-archive-resurrection", pr: 7 },
              { branch: "recovery/production-candidate-20261020", pr: 13 },
              { branch: "feature/yaos-event-sync-clean-base", pr: 14 },
              { branch: "fix/yaos-safe-frontmatter-recovery", pr: 15 },
              { branch: "fix/recover-dot-prefixed-note-ids", pr: 18 },
              { branch: "fix/persist-recovery-diagnostics", pr: 21 },
              { branch: "fix/restore-missing-active-yaos-notes", pr: 22 },
              { branch: "fix/normalize-id-only-frontmatter-comparison", pr: 23 },
              { branch: "fix/remove-temporary-recovery-cron", pr: 24 },
              { branch: "chore/one-time-merged-branch-cleanup", pr: 19 }
            ];
            for (const item of candidates) {
              const { data: pull } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: item.pr
              });
              if (!pull.merged_at || pull.head.ref !== item.branch) {
                core.warning(`Keeping ${item.branch}: PR #${item.pr} is not merged from that branch.`);
                continue;
              }
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `heads/${item.branch}`
                });
                core.info(`Deleted merged branch ${item.branch} (PR #${item.pr}).`);
              } catch (error) {
                if (error.status === 404) core.info(`Branch already absent: ${item.branch}`);
                else throw error;
              }
            }
      - name: Remove this one-time workflow
        uses: actions/github-script@v7
        with:
          script: |
            const path = ".github/workflows/cleanup-merged-branches.yml";
            const { data: file } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              ref: "main"
            });
            await github.rest.repos.deleteFile({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: "Remove one-time merged branch cleanup workflow",
              sha: file.sha,
              branch: "main"
            });
