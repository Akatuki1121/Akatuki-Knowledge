name: Check recovered Worker and YAOS event sync

on:
  pull_request:
  push:
    branches:
      - main
      - recovery/bootstrap-schema-validation
      - recovery/restore-wrangler-do-history
      - recovery/catch-up-existing-event-sync

permissions:
  contents: read

jobs:
  syntax-and-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: python3 scripts/test_pending_migration.py
      - name: Validate recovered migration chain and known schema drift
        run: python3 scripts/test_recovered_migration_chain.py
      - name: Validate Wrangler config and build without deploying
        run: npx --yes wrangler@4 deploy --dry-run --outdir .wrangler-dry-run --config wrangler.toml
      - name: Validate reconstructed baseline in empty SQLite database
        run: python3 scripts/test_reconstructed_baseline.py
      - name: Compile Worker SQL against captured D1 schema
        run: python3 scripts/test_worker_sql_compatibility.py
