name: Check recovered Worker and YAOS event sync

on:
  pull_request:
  push:
    branches:
      - main

# Feature branches are tested by pull_request only. Avoid running the same
# commit once for push and again for pull_request.
concurrency:
  group: check-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changed-files:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      checks: ${{ steps.filter.outputs.checks }}
      worker_build: ${{ steps.filter.outputs.worker_build }}
      integration: ${{ steps.filter.outputs.integration }}
      source: ${{ steps.filter.outputs.source }}
      classifier: ${{ steps.filter.outputs.classifier }}
      agent_tests: ${{ steps.filter.outputs.agent_tests }}
      sync_tests: ${{ steps.filter.outputs.sync_tests }}
      migration_checks: ${{ steps.filter.outputs.migration_checks }}
      test_harness: ${{ steps.filter.outputs.test_harness }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      # Pull-request path filtering uses the GitHub API; the checked-out
      # tree is enough for the remaining checks.
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 1
      # Push path filtering compares against the previous commit, so retain
      # history only for push runs.
      - uses: actions/checkout@v4
        if: github.event_name == 'push'
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            checks:
              - 'src/**'
              - 'scripts/**'
              - 'tests/**'
              - 'migrations/**'
              - 'schema-snapshots/**'
              - 'wrangler.toml'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/**'
            worker_build:
              - 'src/**'
              - 'wrangler.toml'
              - 'package.json'
              - 'package-lock.json'
            integration:
              - 'src/sync-outbox.mjs'
              - 'scripts/test_yaos_worker_integration.mjs'
              - 'scripts/test_reconstructed_baseline.py'
              - 'scripts/test_worker_sql_compatibility.py'
              - 'migrations/**'
              - 'schema-snapshots/**'
              - 'wrangler.toml'
              - 'package.json'
              - 'package-lock.json'
            source:
              - 'src/**'
            classifier:
              - 'scripts/classify_yaos_integration.mjs'
              - '.github/workflows/check.yml'
            agent_tests:
              - 'src/index.js'
              - 'src/gemini-client.mjs'
              - 'src/ai-permission.mjs'
              - 'src/reply-text.mjs'
              - 'src/intent-classifier.mjs'
              - 'scripts/test_agent_*.mjs'
              - 'scripts/test_agent_*.py'
              - 'scripts/check-agent-*.mjs'
              - 'scripts/check-background-task-*.mjs'
              - 'scripts/test-background-task-*.mjs'
              - 'scripts/test-telegram-agent-notifications.mjs'
              - 'src/agent/**'
            sync_tests:
              - 'src/sync-outbox.mjs'
              - 'scripts/check-sync-contract.mjs'
              - 'scripts/classify_yaos_integration.mjs'
              - 'scripts/test-sync-*.mjs'
              - 'scripts/test_classify_yaos_integration.mjs'
            test_harness:
              - 'scripts/run-parallel-checks.mjs'
              - 'scripts/check-groups.mjs'
              - 'scripts/test-check-groups.mjs'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/check.yml'
            migration_checks:
              - 'migrations/**'
              - 'schema-snapshots/**'
              - 'scripts/test_pending_migration.py'
              - 'scripts/test_recovered_migration_chain.py'
              - 'scripts/test_reconstructed_baseline.py'
              - 'scripts/test_worker_sql_compatibility.py'
            deploy:
              - 'src/index.js'
              - 'src/gemini-client.mjs'
              - 'src/ai-permission.mjs'
              - 'src/reply-text.mjs'
              - 'src/intent-classifier.mjs'
              - 'wrangler.toml'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/deploy.yml'

  syntax-and-contract:
    needs: changed-files
    if: needs.changed-files.outputs.checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:core

  agent-domain-tests:
    needs: changed-files
    if: needs.changed-files.outputs.agent_tests == 'true' || needs.changed-files.outputs.test_harness == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:agent

  sync-unit-tests:
    needs:
      - changed-files
      - classify-yaos-integration
    if: >-
      always() &&
      needs.changed-files.outputs.checks == 'true' &&
      (needs.changed-files.outputs.sync_tests == 'true' ||
       needs.changed-files.outputs.test_harness == 'true' ||
       ((needs.classify-yaos-integration.result == 'success' &&
         needs.classify-yaos-integration.outputs.required == 'true') ||
        (needs.classify-yaos-integration.result != 'success' &&
         needs.changed-files.outputs.source == 'true')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:sync

  migration-validation:
    needs: changed-files
    if: needs.changed-files.outputs.migration_checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate pending migrations
        run: python3 scripts/test_pending_migration.py
      - name: Validate recovered migration chain and full schema shape
        run: python3 scripts/test_recovered_migration_chain.py
      - name: Validate reconstructed baseline in empty SQLite database
        run: python3 scripts/test_reconstructed_baseline.py
      - name: Compile Worker SQL against captured D1 schema
        run: python3 scripts/test_worker_sql_compatibility.py

  classify-yaos-integration:
    needs: changed-files
    if: needs.changed-files.outputs.source == 'true' || needs.changed-files.outputs.classifier == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      required: ${{ steps.classify.outputs.required }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Fetch base commit for a shallow diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA" || true
      - name: Classify sync-sensitive source changes
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_CHANGED: ${{ needs.changed-files.outputs.source }}
        run: node scripts/classify_yaos_integration.mjs

  worker-build:
    needs: changed-files
    if: needs.changed-files.outputs.worker_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate Wrangler config and build without deploying
        run: npx --yes wrangler@4.69.0 deploy --dry-run --outdir .wrangler-dry-run --config wrangler.toml

  yaos-worker-integration:
    # Run the end-to-end test for explicitly sync-related files or source diffs
    # classified as sync-sensitive. The classifier fails closed on errors.
    needs:
      - changed-files
      - classify-yaos-integration
    if: >-
      always() &&
      (needs.changed-files.outputs.integration == 'true' ||
       needs.changed-files.outputs.test_harness == 'true' ||
       ((needs.classify-yaos-integration.result == 'success' &&
         needs.classify-yaos-integration.outputs.required == 'true') ||
        (needs.classify-yaos-integration.result != 'success' &&
         needs.changed-files.outputs.source == 'true')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: kavinsood/yaos
          ref: 2174eb89538ce7e213e9e33a0e75ecaf1a3f1f58
          path: yaos
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: yaos/server/package-lock.json
      - name: Install YAOS Worker dependencies
        working-directory: yaos/server
        run: npm ci
      - name: Exercise isolated local D1 and both Workers
        env:
          YAOS_REPO_PATH: ${{ github.workspace }}/yaos
        run: timeout --signal=TERM --kill-after=5s 3m node scripts/test_yaos_worker_integration.mjs


  deploy-production:
    needs:
      - changed-files
      - syntax-and-contract
      - worker-build
      - yaos-worker-integration
      - agent-domain-tests
      - sync-unit-tests
      - migration-validation
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changed-files.outputs.deploy == 'true' &&
      (needs.syntax-and-contract.result == 'success' || needs.syntax-and-contract.result == 'skipped') &&
      (needs.agent-domain-tests.result == 'success' || needs.agent-domain-tests.result == 'skipped') &&
      (needs.sync-unit-tests.result == 'success' || needs.sync-unit-tests.result == 'skipped') &&
      (needs.migration-validation.result == 'success' || needs.migration-validation.result == 'skipped') &&
      (needs.worker-build.result == 'success' || needs.worker-build.result == 'skipped') &&
      (needs.yaos-worker-integration.result == 'success' || needs.yaos-worker-integration.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # All applicable CI checks have passed before this job can start.
      # Keep the migration gate ahead of dependency installation and deployment.
      - name: Gate deployment on pending D1 migrations
        id: migration_gate
        run: |
          pending="$(find migrations/pending -maxdepth 1 -type f -name '*.sql' -print -quit 2>/dev/null || true)"
          if [ -n "$pending" ]; then
            echo "::notice::Production deployment skipped: pending migration $pending requires a separately reviewed rollout."
            echo "allowed=false" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.migration_gate.outputs.allowed == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.migration_gate.outputs.allowed == 'true'
      - name: Require Cloudflare deployment credential
        if: steps.migration_gate.outputs.allowed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Repository Actions secret CLOUDFLARE_API_TOKEN is required for production deployment."
            exit 1
          fi
      - name: Deploy production Worker
        if: steps.migration_gate.outputs.allowed == 'true'
        run: npx --yes wrangler@4.69.0 deploy --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ea03cba73884bef04c37d1e21535e101
