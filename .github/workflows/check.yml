name: Check recovered Worker source

on:
  pull_request:
  push:
    branches:
      - main
      - recovery/normalize-cloudflare-worker-source
      - feature/yaos-event-sync-outbox

permissions:
  contents: read

jobs:
  syntax-and-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
