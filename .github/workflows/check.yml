name: Check recovered Worker source

on:
  pull_request:
  push:
    branches:
      - main
      - recovery/normalize-cloudflare-worker-source
      - recovery/production-candidate-20261020

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Validate Wrangler config and build without deploying
        run: npx --yes wrangler@4 deploy --dry-run --outdir .wrangler-dry-run --config wrangler.toml
