name: Deploy Akatuki Knowledge Worker

on:
  push:
    branches:
      - main
    paths:
      - "src/index.js"
      - "wrangler.toml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: akatuki-knowledge-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      # A merge must not deploy code that depends on a candidate D1 schema.
      # Production migration and deployment are separate, explicitly reviewed steps.
      - name: Gate deployment on pending D1 migrations
        id: migration_gate
        run: |
          pending="$(find migrations/pending -maxdepth 1 -type f -name '*.sql' -print -quit 2>/dev/null || true)"
          if [ -n "$pending" ]; then
            echo "::notice::Production deployment skipped: pending migration $pending requires a separately reviewed rollout."
            echo "allowed=false" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Require Cloudflare deployment credential
        if: steps.migration_gate.outputs.allowed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Repository Actions secret CLOUDFLARE_API_TOKEN is required for production deployment."
            exit 1
          fi
      - name: Deploy production Worker
        if: steps.migration_gate.outputs.allowed == 'true'
        run: npx --yes wrangler@4.69.0 deploy --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ea03cba73884bef04c37d1e21535e101
