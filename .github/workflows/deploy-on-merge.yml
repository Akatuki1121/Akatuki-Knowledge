name: マージ後の自動デプロイ起動

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  actions: write

jobs:
  dispatch-deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: マージコミットのデプロイ実行を確認して dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail

          if [ -z "$MERGE_SHA" ]; then
            echo "::error::マージコミット SHA を取得できませんでした。"
            exit 1
          fi

          recent_head_shas="$(gh run list --workflow deploy.yml --branch main --limit 20 --json headSha --jq '.[].headSha')"
          if grep -Fxq "$MERGE_SHA" <<< "$recent_head_shas"; then
            echo "マージコミットを対象とする Deploy workflow が既に存在するため dispatch を省略します。"
            exit 0
          fi

          gh workflow run deploy.yml --ref main
