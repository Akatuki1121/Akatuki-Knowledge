name: 自動マージ後の一回照合起動保証

on:
  workflow_run:
    workflows:
      - 自動マージ設定
    types:
      - completed

permissions:
  actions: write
  pull-requests: read

concurrency:
  group: auto-merge-verification-${{ github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: true

jobs:
  dispatch-verification:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_sha != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: 自動マージ対象のPRを確認
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          prs_json="$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/pulls")"
          PR_NUMBER="$(jq -r --arg sha "$HEAD_SHA" '[.[] | select(.base.ref == "main" and .head.sha == $sha)][0].number // ""' <<< "$prs_json")"
          if [ -z "$PR_NUMBER" ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Workflow Run のコミットに対応する main 向けPRがないため、確認起動を省略します。"
            exit 0
          fi
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: PRのマージ完了を待機
        id: wait
        if: steps.target.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
            if jq -e '.merged == true' <<< "$pr_json" >/dev/null; then
              merge_sha="$(jq -r '.merge_commit_sha // ""' <<< "$pr_json")"
              if [ -z "$merge_sha" ]; then
                echo "::error::PR はマージ済みですが、マージコミット SHA を取得できません。"
                exit 1
              fi
              echo "merge_sha=$merge_sha" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            state="$(jq -r '.state' <<< "$pr_json")"
            auto_merge="$(jq -r 'if .auto_merge == null then "false" else "true" end' <<< "$pr_json")"
            if [ "$state" = "closed" ] || [ "$auto_merge" != "true" ]; then
              echo "::notice::PRはマージされずに終了したため、一回照合を起動しません。"
              exit 0
            fi
            sleep 30
          done

          echo "::error::自動マージ設定後30分以内にPRのマージを確認できませんでした。"
          exit 1

      - name: マージコミットの一回照合を起動
        if: steps.wait.outputs.merge_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ steps.wait.outputs.merge_sha }}
        run: |
          set -euo pipefail
          jq -n --arg sha "$MERGE_SHA" '{ref:"main",inputs:{target_sha:$sha}}' |
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/verify-production-deploy.yml/dispatches" --input -
          echo "マージコミット $MERGE_SHA の一回照合を起動しました。"
